<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="面向中国高中生的开放数学知识库" />
    <title>高中数学知识库</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css" />
    <style>
      :root { --theme-color: #2563eb; }
      .sidebar { border-right: 1px solid #e5e7eb; }
      .markdown-section { max-width: 920px; }
      .markdown-section blockquote { border-left-color: #2563eb; }
    </style>
  </head>
  <body>
    <div id="app">正在加载知识库……</div>
    <script>
      window.$docsify = {
        name: "高中数学知识库",
        repo: "",
        loadSidebar: true,
        subMaxLevel: 2,
        auto2top: true,
        search: "auto",
        copyCode: { buttonText: "复制", errorText: "复制失败" },
        notFoundPage: "404.md",
        pagination: { previousText: "上一页", nextText: "下一页", crossChapter: true },
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-katex@latest/dist/docsify-katex.js"></script>
  </body>
</html>
